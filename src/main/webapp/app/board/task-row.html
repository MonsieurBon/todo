<div
  class="task"
  [class.pending]="pending()"
  [class.deferred]="deferred()"
  [class.done]="task().done"
>
  <!-- Named by its own content, so a screen reader gets the topics and the due date too; the
       hidden word is what says the name is a thing to open. -->
  <button type="button" class="grow body" (click)="details()">
    <span class="cdk-visually-hidden">Open</span>
    <span class="title truncate">{{ task().title }}</span>
    <app-task-chips class="meta" [task]="task()" />
  </button>

  <app-task-actions [task]="task()" />
</div>
