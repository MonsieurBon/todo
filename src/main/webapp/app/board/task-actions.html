<!-- A completed task is read-only, so reopening it is all it offers. -->
@if (task().done) {
  <button
    matIconButton
    type="button"
    [disabled]="!reopenable()"
    [attr.aria-label]="'Reopen ' + task().title"
    matTooltip="Reopen"
    (click)="reopen()"
  >
    <mat-icon svgIcon="undo" />
  </button>
} @else {
  <button
    matIconButton
    type="button"
    [attr.aria-label]="'Complete ' + task().title"
    matTooltip="Complete"
    (click)="complete()"
  >
    <mat-icon svgIcon="check" />
  </button>
}

@if (!pending() && !task().done) {
  <!-- The menu's actions, for a row with room to show them; the stylesheet shows one or the
       other. -->
  <span class="unfolded">
    <button
      matIconButton
      type="button"
      [disabled]="!online() || !promoteTo()"
      [attr.aria-label]="promoteLabel()"
      [matTooltip]="promoteTo() ? 'Move to ' + zoneName(promoteTo()!) : ''"
      (click)="move(promoteTo())"
    >
      <mat-icon svgIcon="up" />
    </button>
    <button
      matIconButton
      type="button"
      [disabled]="!online() || !demoteTo()"
      [attr.aria-label]="demoteLabel()"
      [matTooltip]="demoteTo() ? 'Move to ' + zoneName(demoteTo()!) : ''"
      (click)="move(demoteTo())"
    >
      <mat-icon svgIcon="down" />
    </button>
    <button
      matIconButton
      type="button"
      [disabled]="!online()"
      [attr.aria-label]="'Defer ' + task().title"
      matTooltip="Defer"
      [matMenuTriggerFor]="deferMenu.menu()"
    >
      <mat-icon svgIcon="later" />
    </button>
    <button
      matIconButton
      type="button"
      [disabled]="!online()"
      [attr.aria-label]="'Edit ' + task().title"
      matTooltip="Edit"
      (click)="edit()"
    >
      <mat-icon svgIcon="edit" />
    </button>
    <button
      matIconButton
      type="button"
      [disabled]="!online()"
      [attr.aria-label]="'Delete ' + task().title"
      matTooltip="Delete"
      (click)="remove()"
    >
      <mat-icon svgIcon="trash" />
    </button>
  </span>
}

@if (!pending() && !task().done) {
  <button
    matIconButton
    type="button"
    class="folded"
    [attr.aria-label]="'Actions for ' + task().title"
    [matMenuTriggerFor]="menu"
  >
    <mat-icon svgIcon="more" />
  </button>
}

<mat-menu #menu="matMenu">
  @if (promoteTo(); as zone) {
    <button mat-menu-item type="button" [disabled]="!online()" (click)="move(zone)">
      <mat-icon svgIcon="up" />
      <span>Move to {{ zoneName(zone) }}</span>
    </button>
  }
  @if (demoteTo(); as zone) {
    <button mat-menu-item type="button" [disabled]="!online()" (click)="move(zone)">
      <mat-icon svgIcon="down" />
      <span>Move to {{ zoneName(zone) }}</span>
    </button>
  }
  <button mat-menu-item type="button" [disabled]="!online()" [matMenuTriggerFor]="deferMenu.menu()">
    <mat-icon svgIcon="later" />
    <span>Defer</span>
  </button>
  <button mat-menu-item type="button" [disabled]="!online()" (click)="editFromMenu()">
    <mat-icon svgIcon="edit" />
    <span>Edit</span>
  </button>
  <button mat-menu-item type="button" [disabled]="!online()" (click)="remove()">
    <mat-icon svgIcon="trash" />
    <span>Delete</span>
  </button>
</mat-menu>

<app-defer-menu
  #deferMenu
  [deferredUntil]="task().deferUntil"
  [offerNow]="deferred()"
  [defer]="defer"
  (now)="undefer()"
/>
