name: Release todo

on:
  push:
    branches: [ "master" ]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # commit the version bump and publish the release
      issues: write          # comment on released issues
      pull-requests: write   # comment on released pull requests
      packages: write        # push the image to GHCR

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release decides the next version from the commits since the last
          # tag, so a shallow clone would make every release look like the first.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          cache: 'npm'
      - run: npm ci

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # A release must not be cut from something that does not pass. The image is built
      # later by semantic-release's publishCmd, once the version is known.
      - name: test frontend
        run: npm run test:ci
      - name: test backend
        run: ./mvnw -B test -Dskip.npm=true -Dskip.installnodenpm=true
      - name: integration tests
        run: ./mvnw -B -Pintegration-tests verify -Dskip.npm=true -Dskip.installnodenpm=true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
