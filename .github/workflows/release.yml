name: Release todo

on:
  push:
    branches: [ "main" ]

# Runs side by side would work out the same next version and race to tag it, so they
# queue. A newer push replaces a run still waiting rather than queueing behind it; that
# loses nothing, because a run releases main as it is when it starts.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# The Java the image runs on. Dependabot holds the Dockerfile to this major.
env:
  JAVA_VERSION: '25'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # publish the release
      issues: write          # comment on released issues
      pull-requests: write   # comment on released pull requests
      packages: write        # push the image to GHCR

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push credential is handed over in the release step alone, not to the
          # installs and tests before it.
          persist-credentials: false
          # The tip, not the commit that started this run. A run that waited would start
          # behind the release commits of the one before it, and semantic-release quietly
          # publishes nothing from a branch that is behind.
          ref: main
          # semantic-release decides the next version from the commits since the last
          # tag, so a shallow clone would make every release look like the first.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          cache: 'npm'
      - run: npm ci

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      # A release must not be cut from something that does not pass. The image is built
      # later by semantic-release's publishCmd, once the version is known.
      - name: test frontend
        run: npm run test:ci
      - name: test backend
        run: ./mvnw -B test -Dskip.npm=true -Dskip.installnodenpm=true
      - name: integration tests
        run: ./mvnw -B -Pintegration-tests verify -Dskip.npm=true -Dskip.installnodenpm=true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release commits and the tag are pushed as the App, the one actor main's
      # ruleset lets past its required checks.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # semantic-release pushes with GITHUB_TOKEN, which the ruleset turns away, unless
      # the remote already takes its push; so the App's token goes on the remote.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          npx semantic-release
