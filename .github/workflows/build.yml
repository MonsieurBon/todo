name: Build todo

# Pull requests only. A push to a pull request branch would repeat this run commit for
# commit, and a push to master is already built by the release workflow.
on:
  pull_request:
    branches: [ "**" ]

# Nothing here writes to the repository.
permissions:
  contents: read

# A new commit on a pull request supersedes the whole matrix at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Java the image runs on. Dependabot holds the Dockerfile to this major.
env:
  JAVA_VERSION: '25'

# The job names are the required checks of main's ruleset. Renaming or removing a job
# leaves every pull request waiting for a check that never comes, and a new job guards
# nothing until the ruleset names it.
jobs:
  lint-frontend:
    name: lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          cache: 'npm'
      - run: npm ci
      - name: lint
        run: npm run lint:check
      - name: format
        run: npm run format:check

  lint-backend:
    name: lint backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      - name: spotless
        run: ./mvnw -B spotless:check

  test-frontend:
    name: test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          cache: 'npm'
      - run: npm ci
      - name: test
        run: npm run test:ci

  test-backend:
    name: test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      # The frontend has its own jobs above. Without these flags the Maven build fetches
      # its own Node and repeats the entire frontend chain inside this job.
      - name: test
        run: ./mvnw -B test -Dskip.npm=true -Dskip.installnodenpm=true

  integration-tests:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      # Testcontainers needs a Docker daemon, which ubuntu-latest provides.
      #
      # OpenApiContractIT rewrites src/main/webapp/api/openapi.json when the API has
      # changed and fails once; on CI that failure is the point, because it means the
      # checked-in contract the web app generates its types from is out of date.
      - name: verify
        run: ./mvnw -B -Pintegration-tests verify -Dskip.npm=true -Dskip.installnodenpm=true

  # Dependabot's pull requests get no Claude review, so this is the one look at what they
  # bring in. Keyed to the author rather than the actor, so it still runs after someone else
  # pushes to the branch.
  scan-image:
    name: scan image
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      - name: build
        run: ./mvnw -B package -DskipTests=true
      - name: build image
        run: docker build -t todo:scan .
      - uses: ./.github/actions/grype-scan
        with:
          image: docker:todo:scan

  e2e:
    name: package + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          cache: 'npm'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      # Started first and waited for last, so Keycloak boots while the jar builds.
      - name: start stack
        run: docker compose up -d
      # Packaging builds the web app into the jar, in the production configuration that
      # alone has the service worker, so this job runs the frontend chain rather than
      # skipping it like the backend jobs do.
      - name: build
        run: ./mvnw -B package -DskipTests=true
      # Proves the release will be able to build its image before main depends on it.
      - name: build image
        run: docker build -t todo:ci .
      - name: wait for stack
        run: docker compose up -d --wait

      # The image, not the jar, so the suite runs on the Java that ships. The realm's
      # redirect URIs and audience are literally http://localhost:8090.
      - name: start app
        run: |
          docker run -d --name todo --network host \
            -e DB_PORT=3307 -e SERVER_PORT=8090 -e TODO_CANONICAL_URI=http://localhost:8090 \
            todo:ci
          timeout 120 bash -c 'until curl -sf http://localhost:8090/actuator/health; do sleep 2; done'

      # Playwright comes from the node_modules the Maven build's `npm ci` left behind, and
      # drives the runner's own Google Chrome, so no browser is downloaded.
      - name: e2e
        run: npm run e2e

      - name: collect logs
        if: failure()
        run: |
          docker logs todo > app.log 2>&1 || true
          docker compose logs --no-color > compose.log 2>&1
      - name: keep traces and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e
          path: |
            test-results/
            app.log
            compose.log
