name: Scan image

# A CVE is usually published after the image that carries it has shipped, and nothing in the
# repository changes when it is, so only a schedule notices. A failed run is what notifies:
# GitHub mails it to whoever last changed the schedule.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  # So a change to the scan is seen working before the schedule depends on it.
  pull_request:
    paths:
      - .github/workflows/scan.yml
      - .github/actions/grype-scan/**
      - .grype.yaml

permissions:
  contents: read
  security-events: write # upload the report to the Security tab

jobs:
  released:
    name: scan released image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/grype-scan
        with:
          image: ghcr.io/monsieurbon/todo:latest
          sarif: grype.sarif
      # Also when the gate failed: the report is where its findings are read.
      - name: Upload to the Security tab
        if: ${{ !cancelled() && hashFiles('grype.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: grype.sarif
          category: released-image
