name: Claude Code Review

# pull_request_target, not pull_request, so the reviewer is main's reviewer.
# On a pull_request event GitHub runs the workflow, the composite action, the
# agent definition and CLAUDE.md all from the branch — so a pull request that
# weakens the review gets judged by the weakened review, and one that edits this
# file cannot be reviewed at all (the action's token exchange requires the
# workflow to exist on the default branch). Here every one of those comes from
# the base branch and only the diff comes from the branch, which is what lets a
# change to the review machinery be reviewed by the machinery it is changing.
on:
  pull_request_target:
    types: [ opened, synchronize, ready_for_review, reopened ]

# Keyed on the pull request number rather than github.ref: under
# pull_request_target the ref is the base branch, so a ref-keyed group would be
# the same value for every open pull request and they would cancel each other.
# Without this a second push while a review is in flight produces two complete
# reviews and two sets of comments — the diff-hash cache below cannot help,
# because neither run has finished to write an entry when the other starts.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Both conditions are security controls here, not optimisations.
    # pull_request_target runs in the base context with access to secrets, so:
    #   - a fork's pull request must never reach it;
    #   - neither must Dependabot's. Under pull_request GitHub itself withheld
    #     secrets from Dependabot; under pull_request_target nothing does but
    #     this line. (Dependabot branches live in this repository, so the fork
    #     check above does not cover them.)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    name: Claude review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      # No `ref:` — under pull_request_target checkout defaults to the base
      # branch. This tree is what the review *is*: the agent definition, the
      # composite action, CLAUDE.md.
      - name: Check out the base branch (the reviewer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The branch under review, as something to read. Nothing is executed from
      # this tree — no install, no build, no test — so a hostile diff has no
      # foothold here; it is fetched by sha rather than by branch name so it
      # cannot move between the event and the checkout, and it carries no
      # credentials.
      - name: Check out the branch under review (the subject)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          fetch-depth: 1
          persist-credentials: false

      # Skip the review when the diff is identical to one already reviewed (e.g.
      # a force-push from a rebase onto main). Any commit that actually changes
      # the diff produces a new key, misses the cache, and gets a fresh review.
      - name: Compute PR diff hash
        id: diff-hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          diff=$(gh pr diff "${{ github.event.pull_request.number }}")
          hash=$(printf '%s' "$diff" | sha256sum | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Look up cache for this diff
        id: diff-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .claude-review-marker
          key: claude-review-pr-${{ github.event.pull_request.number }}-${{ steps.diff-hash.outputs.hash }}

      # continue-on-error keeps the job going even if the review fails; whether
      # it succeeded is decided from the execution output in the assess step.
      - name: Run review
        id: review
        if: steps.diff-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: ./.github/actions/claude-review
        with:
          model: opus
          reviewer: pr-code-reviewer
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          repo: ${{ github.repository }}
          pr: ${{ github.event.pull_request.number }}

      # Decide success from the execution output and, when no review was posted,
      # say so on the pull request rather than failing silently.
      - name: Assess review and post failure notice
        id: assess
        if: steps.diff-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FILE: ${{ steps.review.outputs.execution_file }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -uo pipefail

          if .github/scripts/claude-review-ok.sh "$FILE" >/dev/null; then
            echo "Review posted."
            echo "reviewed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Whether a review was posted and whether the job may go green are two
          # different questions. Only the first decides whether this diff counts
          # as reviewed.
          echo "reviewed=false" >> "$GITHUB_OUTPUT"

          # The action exiting 0 without producing a review is a deliberate skip
          # rather than a crash. Running from the base branch should have
          # removed the only cause we have seen — the action declining because
          # the workflow differs from the copy on the default branch — so this
          # branch is a safety net: if it ever fires, that assumption was wrong
          # and the notice is what makes it visible instead of silent.
          if [ "$REVIEW_OUTCOME" = "success" ]; then
            echo "::warning::The review was skipped by the action; posting a notice and keeping the job green."
            gh pr comment "$PR" --body "$(printf '## ℹ️ Review skipped\n\n`claude-code-action` declined to run, so no review was posted. This is not expected now that the workflow runs from the base branch — worth investigating rather than ignoring.\n\nThis does not block the PR. Details: [run log](%s).\n' "$RUN_URL")" \
              || echo "::warning::Could not post the skip notice."
            exit 0
          fi

          reason=$(.github/scripts/claude-review-reason.sh "$FILE")

          echo "::error::The review failed; posting a notice and failing the job."
          gh pr comment "$PR" --body "$(printf '## ❌ Review did not run\n\nThe review failed, so nothing was posted.\n\n%s\n\nFull error: [run log](%s).\n' "$reason" "$RUN_URL")" \
            || echo "::error::Could not post the failure notice."
          exit 1

      # Mark the diff reviewed only when a review was actually posted, so a
      # failed run isn't cached as "done" and is retried on the next run of the
      # same diff.
      - name: Mark this diff as reviewed
        if: steps.diff-cache.outputs.cache-hit != 'true' && steps.assess.outputs.reviewed == 'true'
        run: touch .claude-review-marker
