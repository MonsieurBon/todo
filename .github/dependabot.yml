# The semver-* keys need an ecosystem Dependabot can read semver from, so docker
# and github-actions take `default-days` only. Where the tiers do apply,
# `default-days` is still the fallback for a bump whose triple does not parse or
# does not move.
#
# A bump of anything that ships in the image is `fix(deps):`, so that merging it
# releases; development dependencies and the workflows' actions are `build`,
# which releases nothing. Every ecosystem names its prefix: left to detect one
# from history, Dependabot could pick up `fix` from the others.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "fix"
      include: "scope"
    cooldown:
      default-days: 7
    # The runtime stays on the LTS the workflows build and test with (JAVA_VERSION).
    # Moving to the next LTS is a deliberate change to both, not a bump.
    ignore:
      - dependency-name: "eclipse-temurin"
        versions:
          - ">= 26"

  # "/" covers .github/workflows only; the glob keeps new composite actions
  # covered without an edit here.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
    # claude-code-action is pinned in both directories above. Without
    # `group-by`, a group still splits per directory and the bump arrives twice.
    groups:
      claude-code-action:
        patterns:
          - "anthropics/claude-code-action"
        group-by: dependency-name

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "fix"
      prefix-development: "build"
      include: "scope"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "fix"
      prefix-development: "build"
      include: "scope"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      angular:
        patterns:
          - "@angular/*"

    # `ignore` applies to security updates too, unlike `cooldown` above — so a
    # fix published above a bound never arrives, with the Dependabot alert as
    # the only thing watching.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
