# The semver-* keys need an ecosystem Dependabot can read semver from, so docker
# and github-actions take `default-days` only. Where the tiers do apply,
# `default-days` is still the fallback for a bump whose triple does not parse or
# does not move.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # "/" covers .github/workflows only; the glob keeps new composite actions
  # covered without an edit here.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    # claude-code-action is pinned in both directories above. Without
    # `group-by`, a group still splits per directory and the bump arrives twice.
    groups:
      claude-code-action:
        patterns:
          - "anthropics/claude-code-action"
        group-by: dependency-name

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      angular-toolchain:
        patterns:
          - "@angular/*"
          - "angular-oauth2-oidc"
          - "typescript"
          - "rxjs"
          - "tslib"
          - "angular-eslint"
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
      semantic-release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"

    # `ignore` applies to security updates too, unlike `cooldown` above — so a
    # fix published above a bound never arrives, with the Dependabot alert as
    # the only thing watching.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rxjs"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tslib"
        update-types: ["version-update:semver-major"]
